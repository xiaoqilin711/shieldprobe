[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldprobe"
version = "0.1.0"
description = "Fingerprint, identify, and bypass dynamic anti-bot (JS-challenge) protections."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ShieldProbe contributors" }]
keywords = ["anti-bot", "web-scraping", "reverse-engineering", "browser-automation", "javascript"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.0"]

[project.scripts]
shieldprobe = "shieldprobe.cli:main"

[tool.setuptools.packages.find]
include = ["shieldprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
